<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude × Obsidian · Guide organikk.co</title>
<style>
@font-face{font-family:"Geist";src:url(__FONT_GEIST__) format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"Geist Mono";src:url(__FONT_MONO__) format("woff2");font-weight:100 900;font-display:block}

:root{
  --ink:#2b2b30; --ink-2:#6f6f78; --line:#e8e6e6; --paper:#fff;
  --c-top:#2f4fe0; --c-bottom:#7fa0ff; --shadow-rgb:33,55,157;
  --wash:#f7f9ff; --tint:#e8eeff;
  --grad:linear-gradient(160deg,var(--c-top) 0%,var(--c-top) 45%,var(--c-bottom) 100%);
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --grad-text:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='240' preserveAspectRatio='none'><defs><filter id='n' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch' result='t'/><feColorMatrix in='t' type='saturate' values='0' result='m'/><feComponentTransfer in='m' result='a'><feFuncA type='linear' slope='.7'/></feComponentTransfer><feComposite in='a' in2='SourceGraphic' operator='in' result='c'/><feBlend in='SourceGraphic' in2='c' mode='overlay'/></filter></defs><rect width='100%' height='100%' fill='%232f4fe0' filter='url(%23n)'/></svg>");
}

@page{size:A4;margin:20mm 18mm 18mm}
@page bleed{size:A4;margin:0}
*{box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Geist",system-ui,-apple-system,sans-serif;
  font-size:10.6pt;line-height:1.62;font-weight:400;
  -webkit-font-smoothing:antialiased;
}
p{margin:0 0 11pt}
strong{font-weight:600}
a{color:inherit;text-decoration:none;border-bottom:.5pt solid rgba(47,79,224,.4)}
.mono{font-family:"Geist Mono",ui-monospace,monospace}

/* ---------- panneaux dégradés grainés ---------- */
.panel{position:relative;isolation:isolate;background:var(--grad);color:#fff;overflow:hidden}
.panel::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.55;mix-blend-mode:overlay;background-image:var(--grain);background-size:260px 260px}
.panel > *{position:relative;z-index:1}

/* ---------- couverture ---------- */
.cover{page:bleed;margin:0;padding:32mm 24mm 24mm;width:210mm;height:297mm;display:flex;flex-direction:column;justify-content:space-between;break-after:page}
.cover .mark{width:15mm;height:15mm}
.cover .kicker{font-family:"Geist Mono",monospace;font-size:8pt;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.82);margin:0 0 9mm}
.cover h1{font-size:34pt;line-height:1.04;letter-spacing:-.025em;font-weight:600;margin:0;max-width:150mm}
.cover .sub{font-size:14pt;line-height:1.3;color:rgba(255,255,255,.88);margin:7mm 0 0;font-weight:400;max-width:120mm}
.cover .lead{font-size:11pt;line-height:1.5;color:rgba(255,255,255,.86);margin:10mm 0 0;max-width:112mm}
.cover .foot{display:flex;justify-content:space-between;align-items:flex-end;font-family:"Geist Mono",monospace;font-size:8.5pt;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.8)}

/* ---------- titres ---------- */
h2.grad,h3.grad{color:var(--c-top)}
.section-title{font-size:22pt;line-height:1.1;letter-spacing:-.02em;font-weight:600;margin:0 0 8mm}

/* ---------- sommaire ---------- */
.toc{break-after:page}
.toc ol{list-style:none;margin:0;padding:0}
.toc li{display:flex;gap:8mm;align-items:baseline;padding:3.4mm 0;border-bottom:.5pt solid var(--line)}
.toc li:last-child{border-bottom:none}
.toc .n{font-family:"Geist Mono",monospace;font-size:8.5pt;color:var(--c-top);letter-spacing:.1em;flex:0 0 20mm}
.toc .t{font-weight:500;font-size:11pt}
.toc .d{color:var(--ink-2);font-size:9.5pt;margin-left:auto;text-align:right;max-width:78mm}

/* ---------- ouverture de phase ---------- */
.phase{break-before:page}
.ph-open{margin:0 0 9mm}
.ph-open .num{font-family:"Geist Mono",monospace;font-size:8.5pt;letter-spacing:.26em;text-transform:uppercase;color:var(--c-top);display:block;margin:0 0 4mm}
.ph-open h2{font-size:26pt;line-height:1.06;letter-spacing:-.025em;font-weight:600;margin:0}
.ph-open .obj{font-size:11.5pt;line-height:1.45;color:var(--ink-2);margin:5mm 0 0;max-width:130mm}
.ph-open .rule{height:1.4pt;background:var(--c-top);width:16mm;border-radius:2pt;margin:7mm 0 0}

h3.sec{font-size:14pt;line-height:1.2;font-weight:600;letter-spacing:-.01em;margin:9mm 0 4mm;break-after:avoid}
h4.sub{font-size:11pt;font-weight:600;margin:6mm 0 2.5mm;break-after:avoid}

/* ---------- listes ---------- */
ul,ol{margin:0 0 11pt;padding-left:5.5mm}
li{margin:0 0 4pt;padding-left:1mm}
li::marker{color:var(--c-top)}
ul.defs{list-style:none;padding:0}
ul.defs li{display:block;padding:2.6mm 0;border-bottom:.5pt solid var(--line);margin:0}
ul.defs li:last-child{border-bottom:none}
ul.defs b{font-weight:600}

/* ---------- encart résumé ---------- */
.resume{border-radius:5mm;padding:11mm 12mm;margin:9mm 0}
.resume .k{font-family:"Geist Mono",monospace;font-size:8pt;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.8);margin:0 0 5mm}
.resume p{font-size:11.5pt;line-height:1.55;margin:0;color:#fff}

/* ---------- règle dure ---------- */
.hard{border-left:1.6pt solid var(--c-top);background:var(--wash);padding:5mm 7mm;margin:7mm 0;border-radius:0 3mm 3mm 0;break-inside:avoid}
.hard p{margin:0}
.hard .k{font-family:"Geist Mono",monospace;font-size:7.5pt;letter-spacing:.22em;text-transform:uppercase;color:var(--c-top);display:block;margin:0 0 2mm}

/* ---------- code ---------- */
pre{background:var(--wash);border:.5pt solid var(--tint);border-radius:3mm;padding:6mm 7mm;font-family:"Geist Mono",ui-monospace,monospace;font-size:7.6pt;line-height:1.55;white-space:pre;overflow:visible;margin:6mm 0;break-inside:avoid;color:#3a3a44}

/* ---------- tableaux ---------- */
table{width:100%;border-collapse:collapse;margin:6mm 0;font-size:9.5pt;break-inside:avoid}
th,td{text-align:left;vertical-align:top;padding:3mm 6mm 3mm 0;border-bottom:.5pt solid var(--line)}
th{font-weight:600;font-size:8pt;letter-spacing:.14em;text-transform:uppercase;color:var(--c-top);border-bottom:1pt solid var(--c-top);font-family:"Geist Mono",monospace}
td:last-child,th:last-child{padding-right:0}
tbody tr:last-child td{border-bottom:none}
td.num{font-family:"Geist Mono",monospace;color:var(--c-top);white-space:nowrap}

/* ---------- erreurs numérotées ---------- */
ol.errs{list-style:none;padding:0;counter-reset:e}
ol.errs li{counter-increment:e;display:flex;gap:6mm;padding:4mm 0;border-bottom:.5pt solid var(--line);margin:0;break-inside:avoid}
ol.errs li:last-child{border-bottom:none}
ol.errs li::before{content:counter(e,decimal-leading-zero);font-family:"Geist Mono",monospace;font-size:9pt;color:var(--c-top);flex:0 0 10mm}

/* ---------- page finale ---------- */
.final{page:bleed;break-before:page;margin:0;padding:44mm 24mm 24mm;width:210mm;height:297mm;display:flex;flex-direction:column;justify-content:space-between}
.final h2{font-size:28pt;line-height:1.06;letter-spacing:-.025em;font-weight:600;margin:0 0 8mm;max-width:130mm}
.final p{font-size:11.5pt;line-height:1.55;color:rgba(255,255,255,.9);max-width:120mm}
.final .cta{display:inline-block;margin:6mm 0 0;background:#fff;color:var(--c-top);font-weight:600;font-size:11pt;padding:4.5mm 8mm;border-radius:3mm;border:none;text-decoration:none}
.final .cta .u{display:block;font-family:"Geist Mono",monospace;font-size:8pt;letter-spacing:.08em;color:var(--ink-2);font-weight:400;margin-top:1.5mm}
.final .foot{display:flex;justify-content:space-between;align-items:flex-end;font-family:"Geist Mono",monospace;font-size:8.5pt;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.final .mark{width:13mm;height:13mm}

code{font-family:"Geist Mono",ui-monospace,monospace;font-size:9pt;background:var(--wash);border-radius:1mm;padding:.3mm 1.2mm;color:#3a3a44}
pre code{background:none;padding:0;font-size:inherit}

/* ---------- ouvertures de section (variables) ---------- */
.part{break-before:page}
.sec-open{margin:0 0 8mm}
.sec-open h2{font-size:26pt;line-height:1.06;letter-spacing:-.025em;font-weight:600;margin:0;max-width:150mm}
.sec-open .kick{font-family:"Geist Mono",monospace;font-size:8.5pt;letter-spacing:.26em;text-transform:uppercase;color:var(--c-top);display:block;margin:0 0 4mm}
.sec-open .lead{font-size:11.5pt;line-height:1.45;color:var(--ink-2);margin:5mm 0 0;max-width:132mm}

/* ---------- compteurs ---------- */
.stats{display:flex;flex-wrap:wrap;margin:0}
.stats div{flex:0 0 50%;padding:5.5mm 0;border-bottom:.5pt solid rgba(255,255,255,.2)}
.stats .n{font-size:25pt;font-weight:600;letter-spacing:-.025em;line-height:1}
.stats .l{font-family:"Geist Mono",monospace;font-size:7.5pt;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.72);margin-top:2.5mm}
.strip{margin:9mm 0 0}
.strip .k{font-family:"Geist Mono",monospace;font-size:7.5pt;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.7);margin:0 0 4mm}
.strip ol{list-style:none;margin:0;padding:0;columns:2;column-gap:10mm}
.strip li{font-size:9.5pt;color:rgba(255,255,255,.92);margin:0 0 2.6mm;break-inside:avoid}

/* ---------- terminal ---------- */
.term{background:#1b1d24;border-radius:3mm;margin:6mm 0;overflow:hidden;break-inside:avoid}
.term .bar{font-family:"Geist Mono",monospace;font-size:7pt;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.48);padding:3.2mm 6mm;border-bottom:.5pt solid rgba(255,255,255,.1)}
.term pre{background:none;border:none;border-radius:0;margin:0;padding:5mm 6mm;color:#d5d8e0;font-size:7.2pt;line-height:1.62}
.term .c{color:#93a9ff}
.term .d{color:#787e93}
.term .g{color:#8ed3a6}

/* ---------- panneau fichier ---------- */
.file{border:.5pt solid var(--tint);border-radius:3mm;margin:6mm 0;overflow:hidden;break-inside:avoid}
.file .bar{font-family:"Geist Mono",monospace;font-size:7.2pt;letter-spacing:.1em;color:var(--c-top);background:var(--wash);padding:3mm 6mm;border-bottom:.5pt solid var(--tint)}
.file pre{background:none;border:none;border-radius:0;margin:0;padding:5mm 6mm;font-size:7.3pt;line-height:1.6}
.file .body{padding:5mm 6mm;font-size:9pt;line-height:1.55}
.file .body p{margin:0 0 5pt}
.file .body h4{font-size:9.5pt;font-weight:600;margin:4mm 0 2mm}
.wl{color:var(--c-top)}

/* ---------- diff ---------- */
.diffbox{border:.5pt solid var(--tint);border-radius:3mm;margin:6mm 0;overflow:hidden;break-inside:avoid}
.diffbox .bar{font-family:"Geist Mono",monospace;font-size:7.2pt;letter-spacing:.1em;color:var(--c-top);background:var(--wash);padding:3mm 6mm;border-bottom:.5pt solid var(--tint)}
.diffbox pre{background:none;border:none;border-radius:0;margin:0;padding:4mm 0;font-size:7.3pt;line-height:1.7}
.diffbox i{font-style:normal;display:block;padding:0 6mm}
.diffbox i.add{color:#166b3d;background:#edf9f2}
.diffbox i.del{color:#9c3131;background:#fdf1f1}
.diffbox i.ctx{color:#7b7f8c}

/* ---------- Obsidian ---------- */
.ob{display:flex;border:.5pt solid var(--tint);border-radius:3mm;overflow:hidden;margin:6mm 0;break-inside:avoid}
.ob .side{flex:0 0 50mm;background:var(--wash);border-right:.5pt solid var(--tint);padding:4.5mm 5mm;font-family:"Geist Mono",monospace;font-size:6.8pt;line-height:2;color:var(--ink-2)}
.ob .side b{color:var(--ink);font-weight:600}
.ob .side .on{color:var(--c-top)}
.ob .note{flex:1;padding:5mm 6mm;font-size:8.8pt;line-height:1.58}
.ob .note h4{font-size:11pt;font-weight:600;margin:0 0 3mm}
.ob .note p{margin:0 0 4pt}

/* ---------- conversation ---------- */
.chat{margin:6mm 0;break-inside:avoid}
.chat .you{font-family:"Geist Mono",monospace;font-size:8.2pt;line-height:1.55;background:var(--tint);border-radius:2.5mm;padding:3.5mm 5mm;color:#27325c}
.chat .cl{border-left:1.6pt solid var(--c-top);padding:1mm 0 1mm 6mm;margin:4.5mm 0 0;font-size:9.2pt;line-height:1.55}
.chat .cl .who{font-family:"Geist Mono",monospace;font-size:7pt;letter-spacing:.2em;text-transform:uppercase;color:var(--c-top);display:block;margin-bottom:2.5mm}
.chat .cl p{margin:0 0 4pt}

/* ---------- citation verbatim ---------- */
.cite{border-left:1.6pt solid var(--tint);padding:1mm 0 1mm 6mm;margin:6mm 0;break-inside:avoid}
.cite p{margin:0;font-size:11pt;line-height:1.5}
.cite .src{display:block;font-family:"Geist Mono",monospace;font-size:7.2pt;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);margin-top:2.5mm}

/* ---------- graphe ---------- */
.graph{margin:7mm 0;break-inside:avoid}
.graph svg{width:100%;height:auto;display:block}
.graph .cap{font-family:"Geist Mono",monospace;font-size:7.2pt;letter-spacing:.12em;color:var(--ink-2);margin:3mm 0 0}

/* ---------- ajouts guide système ---------- */
.mission{background:var(--wash);border-radius:4mm;padding:7mm 8mm;margin:7mm 0;break-inside:avoid}
.mission .k{font-family:"Geist Mono",monospace;font-size:7.5pt;letter-spacing:.22em;text-transform:uppercase;color:var(--c-top);display:block;margin:0 0 3mm}
.mission p{margin:0;font-size:11pt;line-height:1.5}
.out{margin:6mm 0;break-inside:avoid}
.out .k{font-family:"Geist Mono",monospace;font-size:7.5pt;letter-spacing:.22em;text-transform:uppercase;color:var(--c-top);display:block;margin:0 0 3mm}
.out ul{margin:0;padding:0;list-style:none;columns:2;column-gap:8mm}
.out li{padding:2.2mm 0;border-bottom:.5pt solid var(--line);margin:0;break-inside:avoid;font-size:9.8pt}
.skill{border:.5pt solid var(--tint);border-radius:3mm;margin:7mm 0 0;overflow:hidden}
.skill .bar{font-family:"Geist Mono",monospace;font-size:7.2pt;letter-spacing:.1em;color:var(--c-top);background:var(--wash);padding:3mm 6mm;border-bottom:.5pt solid var(--tint);display:flex;justify-content:space-between}
.skill pre{background:none;border:none;border-radius:0;margin:0;padding:5mm 6mm;font-size:7.3pt;line-height:1.6;white-space:pre-wrap;break-inside:auto}
.skill .body{padding:5mm 6mm;font-size:9pt;line-height:1.55}
.skill .body p{margin:0 0 5pt}
.skill .body h4{font-size:9.5pt;font-weight:600;margin:4mm 0 2mm}
.skill .body ul,.skill .body ol{margin:0 0 6pt}
.adv{list-style:none;padding:0;margin:6mm 0;counter-reset:a}
.adv li{counter-increment:a;display:flex;gap:6mm;padding:4.5mm 0;border-bottom:.5pt solid var(--line);margin:0;break-inside:avoid}
.adv li:last-child{border-bottom:none}
.adv li::before{content:counter(a,decimal-leading-zero);font-family:"Geist Mono",monospace;font-size:9pt;color:var(--c-top);flex:0 0 10mm;padding-top:.6mm}
.adv b{display:block;font-weight:600;margin:0 0 1.5mm}
.facts{list-style:none;padding:0;margin:6mm 0}
.facts li{padding:3mm 0 3mm 6mm;border-left:1.6pt solid var(--tint);margin:0 0 3mm;break-inside:avoid}
.facts .src{display:block;font-family:"Geist Mono",monospace;font-size:7pt;letter-spacing:.12em;color:var(--ink-2);margin-top:1.5mm}
h3.sub3{font-size:16pt;line-height:1.15;font-weight:600;letter-spacing:-.015em;margin:12mm 0 5mm;break-after:avoid}
.chat .you{font-size:8.6pt}
</style>
</head>
