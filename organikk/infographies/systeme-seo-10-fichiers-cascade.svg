<text x="96" y="202" style="font-size:24px;fill:#FFF">avec Claude Code, en 10 fichiers</text>
<text x="96" y="252" style="font-size:20px;fill:#FFF;opacity:.85">Tu ne redonnes plus tes méthodes à chaque conversation. Claude les retrouve.</text>
