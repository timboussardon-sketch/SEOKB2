<text class="ct" x="100" y="370">CLAUDE.md</text>
<text class="d" x="100" y="408">Le premier fichier que Claude Code consulte. Il lui indique</text>
<text class="d" x="100" y="436">où trouver tes règles, tes méthodes et tes instructions.</text>
