<path class="line" d="M1252.1 463.2 A270 270 0 0 1 1252.1 656.8" marker-end="url(#p)"/>
<path class="line" d="M1209.8 729.9 A270 270 0 0 1 1042.2 826.7" marker-end="url(#p)"/>
<path class="line" d="M957.8 826.7 A270 270 0 0 1 790.2 729.9" marker-end="url(#p)"/>
<path class="line" d="M747.9 656.8 A270 270 0 0 1 747.9 463.2" marker-end="url(#p)"/>
<path class="line" d="M790.2 390.1 A270 270 0 0 1 957.8 293.3" marker-end="url(#p)"/>
<circle cx="1000.0" cy="290.0" r="7" fill="#0B0B0F"/>
<text class="a" x="1000.0" y="212.0" text-anchor="middle">01</text>
<text class="t" x="1000.0" y="242.0" text-anchor="middle">raw/</text>
<text class="s" x="1000.0" y="268.0" text-anchor="middle">sources brutes, exports GSC</text>
<circle cx="1233.8" cy="425.0" r="7" fill="#0B0B0F"/>
<text class="a" x="1263.8" y="391.0" text-anchor="start">02</text>
<text class="t" x="1263.8" y="421.0" text-anchor="start">Claude Code</text>
<text class="s" x="1263.8" y="447.0" text-anchor="start">ingère, relie, cite</text>
<circle cx="1233.8" cy="695.0" r="7" fill="#0B0B0F"/>
<text class="a" x="1263.8" y="661.0" text-anchor="start">03</text>
<text class="t" x="1263.8" y="691.0" text-anchor="start">wiki/</text>
<text class="s" x="1263.8" y="717.0" text-anchor="start">1 034 pages compilées</text>
<circle cx="1000.0" cy="830.0" r="7" fill="#0B0B0F"/>
<text class="a" x="1000.0" y="868.0" text-anchor="middle">04</text>
<text class="t" x="1000.0" y="898.0" text-anchor="middle">Skills SEO</text>
<text class="s" x="1000.0" y="924.0" text-anchor="middle">briefs, clusters, articles</text>
<circle cx="766.2" cy="695.0" r="7" fill="#0B0B0F"/>
<text class="a" x="736.2" y="661.0" text-anchor="end">05</text>
<text class="t" x="736.2" y="691.0" text-anchor="end">Publication</text>
<text class="s" x="736.2" y="717.0" text-anchor="end">contenu en ligne</text>
<g fill="url(#og)" filter="url(#on)"><circle cx="766.2" cy="425.0" r="40"/></g>
<text class="a" x="706.2" y="391.0" text-anchor="end">06</text>
<text class="t" x="706.2" y="421.0" text-anchor="end">Preuve</text>
<text class="s" x="706.2" y="447.0" text-anchor="end">mesure à J+30 et J+90</text>
<text class="t" x="60" y="700">La donnée de preuve ferme la boucle</text>
<text class="s" x="60" y="736">Le contenu publié revient mesuré dans raw/data/exports-gsc/,</text>
<text class="s" x="60" y="762">puis gsc-watcher en tire une fiche preuve.</text>
<text class="s" x="60" y="788">Sans elle, les hypothèses restent ouvertes.</text>
<text class="a" x="60" y="824">AGENTS.md §14</text>
</svg>